name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: bash scripts/verify-fixtures.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p zarra --no-default-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: npm --prefix example test
      - name: Verify path installation
        run: |
          install_root="$(mktemp -d)"
          trap 'rm -rf -- "${install_root:?}"' EXIT
          cargo install --path crates/zarra-cli --root "$install_root"
          "$install_root/bin/zarra" --help
      - run: cargo package -p zarra --list --allow-dirty
      - run: cargo package -p zarra-cli --list --allow-dirty

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.91.0
      - run: cargo test --workspace --all-features --locked

  gdal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/test-gdal.sh
