[workspace]
resolver = "2"
members = ["crates/zarra", "crates/zarra-cli", "crates/zarra-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/afterrealism/zarra"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# Keep zarrs_http 0.3.1 on the same storage trait source as the zarrs backport.
[patch.crates-io]
zarrs_storage = { git = "https://github.com/zarrs/zarrs", rev = "9e55886ecfc4e8f282632d6fb7682869ca69db4b" }
