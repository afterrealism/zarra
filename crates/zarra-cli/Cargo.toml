[package]
name = "zarra-cli"
description = "CLI and local MapLibre viewer for canonical multiscale Zarr v3 rasters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zarr", "raster", "geospatial", "cli", "maplibre"]
categories = ["science::geo", "command-line-utilities"]
include = ["src/**", "assets/**", "tests/**", "Cargo.toml", "README.md"]

[lints]
workspace = true

[[bin]]
name = "zarra"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
zarra = { version = "0.1.0", path = "../zarra", default-features = false, features = ["local", "http", "sql"] }

[dev-dependencies]
png = "=0.18.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
