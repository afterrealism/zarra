[package]
name = "zarra"
description = "Convert, query, and render canonical multiscale Zarr v3 rasters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zarr", "raster", "geospatial", "gdal", "cog"]
categories = ["science::geo", "parser-implementations"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md"]

[package.metadata.docs.rs]
features = ["async", "http", "sql"]

[lints]
workspace = true

[dependencies]
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
thiserror = "2"
url = { version = "2", optional = true }
rusqlite = { version = "0.41.0", features = ["bundled", "hooks", "limits"], optional = true }
# The 0.23.15 backport fixes sparse shard-index overflow without changing the 1.91 MSRV.
zarrs = { version = "=0.23.15", git = "https://github.com/zarrs/zarrs", rev = "9e55886ecfc4e8f282632d6fb7682869ca69db4b", default-features = false, features = ["sharding", "crc32c", "zstd"] }
zarrs_http = { version = "=0.3.1", optional = true }

[features]
default = ["local"]
local = ["dep:tempfile", "zarrs/filesystem"]
async = ["zarrs/async"]
sql = ["dep:rusqlite"]
http = ["dep:zarrs_http", "dep:url"]

[dev-dependencies]
futures = "0.3"
