[package]
name = "zarra"
description = "Canonical multiscale Zarr v3 raster manifests and validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md"]

[package.metadata.docs.rs]
features = ["http"]

[lints]
workspace = true

[dependencies]
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = { version = "2", optional = true }
zarrs = { version = "=0.23.14", default-features = false, features = ["filesystem", "sharding", "crc32c", "zstd"] }
zarrs_http = { version = "=0.3.1", optional = true }

[features]
default = []
http = ["dep:zarrs_http", "dep:url"]
